<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>BinnenBeter</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap">
<style>
/* Layout: één kolom, groene kop, tegels → onderwerp → meer uitleg. Mobile first. */
:root{
  --groen:#00811f; --groen-donker:#00661a; --groen-zacht:#e6f2e9;
  --bg:#ffffff; --vlak:#f4f6f4; --fg:#1d2420; --fg-zacht:#55605a; --lijn:#d9e0db;
  --let-op:#fff4d6; --let-op-fg:#6b4e00;
  --font:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --groen:#3fb860; --groen-donker:#2f9a4d; --groen-zacht:#16301e;
  --bg:#121614; --vlak:#1b211e; --fg:#e8ede9; --fg-zacht:#a6b2ab; --lijn:#2e3832;
  --let-op:#3a3016; --let-op-fg:#f2d78a; color-scheme:dark}}
:root[data-theme="dark"]{
  --groen:#3fb860; --groen-donker:#2f9a4d; --groen-zacht:#16301e;
  --bg:#121614; --vlak:#1b211e; --fg:#e8ede9; --fg-zacht:#a6b2ab; --lijn:#2e3832;
  --let-op:#3a3016; --let-op-fg:#f2d78a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#00811f}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:#00811f;color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header .wrap{padding-block:12px;display:flex;align-items:center;gap:12px}
.logo{width:36px;height:36px;border-radius:8px;background:#fff;color:#00811f;display:grid;place-items:center;font-weight:800;font-size:24px;flex:none}
.kop{min-width:0}
.kop b{display:block;font-size:19px;line-height:1.2}
.kop span{font-size:14px;opacity:.9}
.terug{margin-left:auto;background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:10px;font:inherit;font-weight:600;padding:10px 14px;min-height:44px;cursor:pointer}
.terug:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #ffbf00;outline-offset:2px}
main .wrap{padding-block:16px 96px;display:flex;flex-direction:column;gap:20px}
h1{font-size:26px;line-height:1.2;margin:0;text-wrap:balance}
h2{font-size:20px;margin:0;text-wrap:balance}
p{margin:0}
.zoek{position:relative}
.zoek input{width:100%;font:inherit;font-size:18px;padding:14px 16px;min-height:52px;border:2px solid var(--lijn);border-radius:12px;background:var(--bg);color:var(--fg)}
.zoek input:focus{border-color:var(--groen);outline:none}
.tegels{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tegel{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;background:var(--vlak);border:1px solid var(--lijn);border-radius:14px;padding:14px;min-height:112px;font:inherit;color:var(--fg);cursor:pointer}
.tegel:hover{border-color:var(--groen)}
.tegel svg{width:32px;height:32px;color:var(--groen);flex:none}
.tegel b{font-size:16px;line-height:1.25}
.sectie{display:flex;flex-direction:column;gap:10px}
.label{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-zacht)}
.vraag{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;background:var(--bg);border:1px solid var(--lijn);border-radius:12px;padding:14px 16px;min-height:52px;font:inherit;font-weight:600;color:var(--fg);cursor:pointer}
.vraag::after{content:"›";font-size:24px;color:var(--groen)}
.kort{font-size:20px;line-height:1.45;font-weight:600}
.beeld{background:#fff;border:1px solid var(--lijn);border-radius:16px;overflow:hidden;max-width:100%}
.beeld img{display:block;width:100%;height:auto}
.stappen{margin:0;padding:0;list-style:none;counter-reset:stap;display:flex;flex-direction:column;gap:10px}
.stappen li{counter-increment:stap;display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start}
.stappen li::before{content:counter(stap);width:32px;height:32px;border-radius:50%;background:var(--groen);color:#fff;font-weight:700;display:grid;place-items:center}
.letop{background:var(--let-op);color:var(--let-op-fg);border-radius:14px;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.letop ul{margin:0;padding-left:20px}
.tegel .duim{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:8px;background:#fff}
.klant{background:var(--groen-zacht);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.klant .label{color:var(--groen-donker)}
:root[data-theme="dark"] .klant .label{color:var(--groen)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .klant .label{color:var(--groen)}}
.klant p{font-style:italic}
ul.punten{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.meer{background:var(--groen);color:#fff;border:0;border-radius:12px;font:inherit;font-weight:700;padding:14px;min-height:52px;cursor:pointer}
.bron{border-top:1px solid var(--lijn);padding-top:14px;font-size:15px;color:var(--fg-zacht);display:flex;flex-direction:column;gap:8px}
.bron a{color:var(--groen);font-weight:600}
.disclaimer{background:var(--let-op);color:var(--let-op-fg);border-radius:12px;padding:12px 14px;font-size:15px}
.leeg{color:var(--fg-zacht)}
mark{background:var(--let-op);color:inherit;border-radius:3px}
.voet{font-size:14px;color:var(--fg-zacht)}
.soorten{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.soort{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--vlak);border:2px solid var(--lijn);border-radius:12px;padding:10px 6px;min-height:72px;font:inherit;font-size:14px;font-weight:600;color:var(--fg);cursor:pointer;text-align:center}
.soort svg{width:26px;height:26px;color:var(--groen)}
.soort[aria-selected="true"]{border-color:var(--groen);background:var(--groen-zacht)}
.soortlabel{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--groen-donker);background:var(--groen-zacht);border-radius:6px;padding:1px 6px;margin-right:6px}
details{border:1px solid var(--lijn);border-radius:12px;padding:12px 16px;background:var(--bg)}
details summary{font-weight:700;cursor:pointer;min-height:28px;color:var(--groen-donker)}
details dl{margin:10px 0 0;display:grid;gap:4px}
details dt{font-weight:700;margin-top:6px}
details dd{margin:0;color:var(--fg)}
details a{color:var(--groen);font-weight:600}
.kopieer{font-weight:700;user-select:all}
.termijnen{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.termijnen li{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start;border-bottom:1px solid var(--lijn);padding-bottom:8px}
.termijnen .getal{font-size:20px;font-weight:800;color:var(--groen);font-variant-numeric:tabular-nums}
.termijnen small{color:var(--fg-zacht)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) details summary,:root:not([data-theme="light"]) .soortlabel{color:var(--groen)}}
:root[data-theme="dark"] details summary,:root[data-theme="dark"] .soortlabel{color:var(--groen)}
.beta-knop{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;align-items:center;gap:8px;background:var(--fg);color:var(--bg);text-decoration:none;font-weight:700;border-radius:999px;padding:12px 18px;min-height:48px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.beta-knop svg{width:20px;height:20px;color:#ffbf00}
.beta-knop span{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;background:#ffbf00;color:#1d2420;border-radius:6px;padding:1px 6px}
.beta-tegel small{color:var(--fg-zacht);font-size:14px;line-height:1.35}
.mock{position:relative;border:2px dashed var(--groen);border-radius:18px;padding:30px 14px 14px;background:var(--vlak)}
.mock::before{content:"Voorbeeld · niet echt";position:absolute;top:-1px;left:14px;transform:translateY(-50%);background:#ffbf00;color:#1d2420;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:6px;padding:2px 8px}
.mock small{color:var(--fg-zacht)}
.m-bericht,.m-brief,.m-contact,.m-taal,.m-form,.m-loc{background:var(--bg);border:1px solid var(--lijn);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.m-kop{display:flex;gap:10px;align-items:center}
.m-avatar{width:40px;height:40px;border-radius:50%;background:var(--groen);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.m-knop{align-self:flex-start;background:var(--groen);color:#fff;border:0;border-radius:10px;font:inherit;font-weight:700;padding:10px 16px;min-height:44px;cursor:pointer}
.m-nieuws{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.m-nieuws li{background:var(--bg);border:1px solid var(--lijn);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.m-tag{align-self:flex-start;font-size:12px;font-weight:700;color:var(--groen-donker);background:var(--groen-zacht);border-radius:6px;padding:1px 6px}
.m-form label{font-weight:700;font-size:15px}
.m-form select,.m-form textarea{font:inherit;padding:10px;border:1px solid var(--lijn);border-radius:10px;background:var(--bg);color:var(--fg);width:100%}
.m-chips{display:flex;flex-wrap:wrap;gap:6px}
.m-chip{border:1px solid var(--lijn);border-radius:999px;padding:6px 12px;font-size:15px;cursor:pointer;background:var(--bg)}
.m-chip.aan{background:var(--groen);border-color:var(--groen);color:#fff}
.m-foto{border:1px dashed var(--lijn);border-radius:10px;padding:12px;text-align:center;color:var(--fg-zacht)}
.m-schoon{display:flex;flex-direction:column;gap:10px}
.m-rij{display:flex;justify-content:space-between;align-items:center;gap:8px}
.m-niv{font-size:13px;font-weight:800;border-radius:6px;padding:2px 8px}
.niv-A{background:#e5f4e4;color:#1d6b2a}.niv-B{background:#f9eeda;color:#7a5600}.niv-C{background:#fbebeb;color:#9b2222}
.m-bars{display:flex;align-items:flex-end;gap:6px;height:56px;border-bottom:1px solid var(--lijn)}
.m-bars span{flex:1;background:var(--groen);border-radius:4px 4px 0 0;opacity:.85}
.m-bars span:last-child{opacity:1}
.m-contact ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.m-contact li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--lijn);padding-bottom:6px}
.m-brief{border-left:4px solid #ffbf00}
.m-toggle{display:flex;align-self:flex-start;border:1px solid var(--lijn);border-radius:999px;overflow:hidden}
.m-toggle span{padding:6px 14px;font-weight:700}.m-toggle .aan{background:var(--groen);color:#fff}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:12px;z-index:30;font-weight:600;max-width:calc(100% - 32px)}
@media (min-width:560px){.tegels{grid-template-columns:repeat(3,1fr)}.soorten{grid-template-columns:repeat(4,1fr)}}
@media (prefers-reduced-motion:no-preference){.tegel,.vraag{transition:border-color .15s}}
</style>
</head>

function woordenVan(q){
 const ruw=q.toLowerCase().replace(/[^\p{L}\p{N}€ ]/gu," ").split(/\s+/).filter(w=>w&&!STOP.has(w));
 const uit=new Set(); ruw.forEach(w=>{uit.add(w);(SYN[w]||"").split(" ").filter(Boolean).forEach(s=>uit.add(s))});
 return {ruw,alle:[...uit]};
}
function score(t,woorden){
 const titel=t.titel.toLowerCase(), tekst=(t.titel+" "+t.kort+" "+(t.klant||"")+" "+(t.meer||t.stappen||[]).join(" ")+" "+t.woorden).toLowerCase();
 let s=0; woorden.forEach(w=>{const stam=w.length>5?w.slice(0,w.length-2):w;
  if(titel.includes(stam))s+=3; else if(t.woorden.toLowerCase().includes(stam))s+=2; else if(tekst.includes(stam))s+=1});
 return s;
}
function toonZoek(){

 hits.sort((a,b)=>b.sc-a.sc); hits=hits.slice(0,6);
 r.innerHTML=hits.length?`<div class="sectie"><span class="label">Beste antwoorden</span>${hits.map(({k,t})=>`<button class="vraag" data-ga="${k}-${t.id}"><span><span class="soortlabel">${SOORTEN[k].kort}</span>${t.titel}<br><span style="font-weight:400;color:var(--fg-zacht)">${t.kort}</span></span></button>`).join("")}</div>`

}

function betaOverzicht(){
 terug.hidden=false;
 app.innerHTML=`<span class="label">Ideeën · beta</span><h1>Wat kan er later bij?</h1>
 <p class="leeg">Dit zijn ideeën met voorbeelddata. Niets hiervan werkt al en niets wordt verstuurd. Kijk rond en laat weten wat jij handig vindt.</p>
 <div class="tegels">${BETA.map(b=>`<button class="tegel beta-tegel" data-ga="beta-${b.id}">${svg(b.icon)}<b>${b.titel}</b><small>${b.kort}</small></button>`).join("")}</div>
 <div class="disclaimer">Concept. De voorbeelden gebruiken verzonnen locaties, namen en cijfers.</div>`;
 window.scrollTo(0,0);
}
function betaDetail(id){
 const b=BETA.find(x=>x.id===id); if(!b){betaOverzicht();return}
 terug.hidden=false;
 app.innerHTML=`<span class="label">Ideeën · beta</span><h1>${b.titel}</h1><p class="kort">${b.kort}</p>
 <div class="mock" aria-label="Voorbeeld van hoe het eruit kan zien">${b.mock()}</div>
 <section class="sectie"><span class="label">Wat is ervoor nodig?</span><ul class="punten">${b.nodig.map(n=>`<li>${n}</li>`).join("")}</ul></section>
 <button class="vraag" data-ga="beta">Alle ideeën</button>`;
 window.scrollTo(0,0);
}
function toast(t){let el=document.getElementById("toast");if(!el){el=document.createElement("div");el.id="toast";el.setAttribute("role","status");document.body.appendChild(el)}
 el.textContent=t;el.hidden=false;clearTimeout(el._t);el._t=setTimeout(()=>{el.hidden=true},2600)}
app.addEventListener("submit",e=>{if(e.target.matches("[data-mockform]")){e.preventDefault();toast("Dit is een voorbeeld. Er is niets verstuurd.")}});
app.addEventListener("click",e=>{const c=e.target.closest(".m-chip");if(c){c.parentElement.querySelectorAll(".m-chip").forEach(x=>x.classList.remove("aan"));c.classList.add("aan")}
 if(e.target.closest("[data-toast]"))toast("Dit is een voorbeeld. Er gebeurt nog niets.")});

// hash: "<soort>" of "<soort>-<onderwerp>"
function route(){
 const h0=location.hash.slice(1); if(h0==='beta'){betaOverzicht();return} if(h0.startsWith('beta-')){betaDetail(h0.slice(5));return}
 const h=location.hash.slice(1), d=h.indexOf("-"), k=d<0?h:h.slice(0,d), id=d<0?"":h.slice(d+1);
 if(SOORTEN[k]){soort=k;try{localStorage.setItem("soort",k)}catch(e){}}
 id?onderwerp(id):start();
}
app.addEventListener("click",e=>{
 const so=e.target.closest("[data-soort]"); if(so){zoekterm="";try{sessionStorage.setItem("zoek","")}catch(x){}location.hash=so.dataset.soort;return}
 const ga=e.target.closest("[data-ga]"); if(ga){location.hash=ga.dataset.ga;return}
 const b=e.target.closest("[data-id]"); if(b)location.hash=soort+"-"+b.dataset.id});
terug.onclick=()=>{location.hash=soort};
window.addEventListener("hashchange",route);
route();
</script>
